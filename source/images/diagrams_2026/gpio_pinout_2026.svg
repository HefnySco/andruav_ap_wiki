<text x="380.0" y="988" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">de_rpi_gpio config: GPIO_ACTION_PORT_CONFIG selects a pin by BCM number (field "p") and a mode (field "m")</text>
<text x="380.0" y="1008" font-size="11" fill="#666666" text-anchor="middle">Digital pins support PORT_WRITE (on/off); the dashed-ring pins (12, 13, 18, 19) additionally support hardware PWM (duty width via field "d")</text>
<text x="380.0" y="1028" font-size="10" fill="#999999" text-anchor="middle">Same 40-pin layout across Pi Zero W/2W, Pi 3, Pi 4, Pi 5, Pi 400. Source: standard Raspberry Pi GPIO header pinout — 2026</text>
