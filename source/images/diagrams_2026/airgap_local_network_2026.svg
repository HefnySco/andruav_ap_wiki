<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="an_a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2471a3"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="520" fill="#ffffff"/>
  <text x="450" y="28" font-size="17" fill="#333333" text-anchor="middle" font-weight="bold">airgap.local — One Raspberry Pi, Its Own Wi-Fi, No Internet</text>

  <!-- Wi-Fi zone -->
  <rect x="20" y="50" width="860" height="450" rx="18" fill="#f4f9fd" stroke="#aed6f1" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="40" y="74" font-size="13" fill="#2471a3" font-weight="bold">Wi-Fi  "DE_SERVER"  ·  192.169.9.0/24  ·  DHCP and DNS from the Pi</text>

  <!-- Pi -->
  <rect x="300" y="95" width="560" height="385" rx="14" fill="#fef9e7" stroke="#b7950b" stroke-width="2"/>
  <text x="580" y="120" font-size="15" fill="#7d6608" text-anchor="middle" font-weight="bold">Raspberry Pi  ·  airgap.local  ·  192.169.9.1</text>

  <!-- service grid: 2 columns x 4 rows -->
  <g font-size="12">
    <rect x="320" y="135" width="255" height="62" rx="8" fill="#2980b9"/>
    <text x="447" y="160" fill="#ffffff" text-anchor="middle" font-weight="bold">WebClient (GCS)</text>
    <text x="447" y="180" fill="#eaf2f8" text-anchor="middle">https://airgap.local:8001</text>

    <rect x="585" y="135" width="255" height="62" rx="8" fill="#7d3c98"/>
    <text x="712" y="160" fill="#ffffff" text-anchor="middle" font-weight="bold">Wiki + GUIDME.md</text>
    <text x="712" y="180" fill="#f4ecf7" text-anchor="middle">https://airgap.local:8080</text>

    <rect x="320" y="207" width="255" height="62" rx="8" fill="#c0392b"/>
    <text x="447" y="232" fill="#ffffff" text-anchor="middle" font-weight="bold">Authenticator admin</text>
    <text x="447" y="252" fill="#fdedec" text-anchor="middle">https://airgap.local:8089/admin/login</text>

    <rect x="585" y="207" width="255" height="62" rx="8" fill="#16a085"/>
    <text x="712" y="232" fill="#ffffff" text-anchor="middle" font-weight="bold">Storage dashboard</text>
    <text x="712" y="252" fill="#e8f8f5" text-anchor="middle">https://airgap.local:9001/admin/login</text>

    <rect x="320" y="279" width="255" height="62" rx="8" fill="#2471a3"/>
    <text x="447" y="304" fill="#ffffff" text-anchor="middle" font-weight="bold">Login 19408 · Comm 9966</text>
    <text x="447" y="324" fill="#eaf2f8" text-anchor="middle">units and WebClients connect here</text>

    <rect x="585" y="279" width="255" height="62" rx="8" fill="#d35400"/>
    <text x="712" y="304" fill="#ffffff" text-anchor="middle" font-weight="bold">UDP Relay 9100</text>
    <text x="712" y="324" fill="#fdebd0" text-anchor="middle">MAVLink ports 40000–40999</text>

    <rect x="320" y="351" width="255" height="62" rx="8" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.5"/>
    <text x="447" y="376" fill="#333333" text-anchor="middle" font-weight="bold">Offline maps</text>
    <text x="447" y="396" fill="#555555" text-anchor="middle">http://airgap.local:88</text>

    <rect x="585" y="351" width="255" height="62" rx="8" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.5"/>
    <text x="712" y="376" fill="#333333" text-anchor="middle" font-weight="bold">Video relay (coturn)</text>
    <text x="712" y="396" fill="#555555" text-anchor="middle">port 3478</text>
  </g>
  <text x="580" y="452" font-size="11" fill="#7d6608" text-anchor="middle">Rust servers run under systemd in /opt/droneengage · web sites run under pm2</text>
  <text x="580" y="469" font-size="11" fill="#7d6608" text-anchor="middle">eth0 can join a normal LAN when internet is available</text>

  <!-- clients -->
  <rect x="45" y="120" width="200" height="70" rx="10" fill="#ffffff" stroke="#2980b9" stroke-width="2"/>
  <text x="145" y="148" font-size="14" fill="#1b4f72" text-anchor="middle" font-weight="bold">Laptop / tablet</text>
  <text x="145" y="168" font-size="11" fill="#555555" text-anchor="middle">browser: WebClient, admin, wiki</text>

  <rect x="45" y="240" width="200" height="70" rx="10" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
  <text x="145" y="268" font-size="14" fill="#186a3b" text-anchor="middle" font-weight="bold">Vehicle unit</text>
  <text x="145" y="288" font-size="11" fill="#555555" text-anchor="middle">DroneEngage Pi or Andruav</text>

  <rect x="45" y="360" width="200" height="70" rx="10" fill="#ffffff" stroke="#8e44ad" stroke-width="2"/>
  <text x="145" y="388" font-size="14" fill="#5b2c6f" text-anchor="middle" font-weight="bold">MAVLink GCS</text>
  <text x="145" y="408" font-size="11" fill="#555555" text-anchor="middle">QGroundControl, Mission Planner</text>

  <line x1="247" y1="155" x2="316" y2="165" stroke="#2471a3" stroke-width="2" marker-end="url(#an_a)"/>
  <line x1="247" y1="275" x2="316" y2="305" stroke="#2471a3" stroke-width="2" marker-end="url(#an_a)"/>
  <path d="M247,410 L300,424 H850 V310 H842" fill="none" stroke="#d35400" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#an_a)"/>
  <text x="270" y="140" font-size="11" fill="#2471a3">Wi-Fi</text>
  <text x="270" y="270" font-size="11" fill="#2471a3">Wi-Fi</text>
  <text x="268" y="410" font-size="11" fill="#d35400">UDP</text>
</svg>
