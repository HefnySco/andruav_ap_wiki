<svg viewBox="0 0 880 330" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="nf_a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="330" fill="#ffffff"/>
  <text x="440" y="28" font-size="17" fill="#333333" text-anchor="middle" font-weight="bold">News — Post Once, Every WebClient Sees It</text>

  <rect x="20" y="70" width="180" height="80" rx="10" fill="#566573" stroke="#2c3e50" stroke-width="1.5"/>
  <text x="110" y="100" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Admin</text>
  <text x="110" y="120" font-size="11" fill="#eaeded" text-anchor="middle">Storage dashboard</text>
  <text x="110" y="137" font-size="11" fill="#eaeded" text-anchor="middle">global or account news</text>

  <rect x="20" y="200" width="180" height="80" rx="10" fill="#2980b9" stroke="#1b4f72" stroke-width="1.5"/>
  <text x="110" y="230" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">WebClient user</text>
  <text x="110" y="250" font-size="11" fill="#eaf2f8" text-anchor="middle">"Post News" panel</text>
  <text x="110" y="267" font-size="11" fill="#eaf2f8" text-anchor="middle">account news only</text>

  <rect x="270" y="125" width="190" height="100" rx="10" fill="#16a085" stroke="#0e6655" stroke-width="1.5"/>
  <text x="365" y="158" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Storage Server</text>
  <text x="365" y="178" font-size="11" fill="#e8f8f5" text-anchor="middle">saves the news (SQLite)</text>
  <text x="365" y="196" font-size="11" fill="#e8f8f5" text-anchor="middle">pushes it at once</text>

  <rect x="520" y="125" width="170" height="100" rx="10" fill="#2471a3" stroke="#154360" stroke-width="1.5"/>
  <text x="605" y="160" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Communication</text>
  <text x="605" y="178" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Server(s)</text>
  <text x="605" y="198" font-size="11" fill="#eaf2f8" text-anchor="middle">route by account</text>

  <rect x="745" y="60" width="120" height="56" rx="8" fill="#ffffff" stroke="#2980b9" stroke-width="1.5"/>
  <text x="805" y="85" font-size="12" fill="#1b4f72" text-anchor="middle" font-weight="bold">WebClient</text>
  <text x="805" y="102" font-size="10" fill="#555555" text-anchor="middle">account A</text>
  <rect x="745" y="147" width="120" height="56" rx="8" fill="#ffffff" stroke="#2980b9" stroke-width="1.5"/>
  <text x="805" y="172" font-size="12" fill="#1b4f72" text-anchor="middle" font-weight="bold">WebClient</text>
  <text x="805" y="189" font-size="10" fill="#555555" text-anchor="middle">account A</text>
  <rect x="745" y="234" width="120" height="56" rx="8" fill="#ffffff" stroke="#2980b9" stroke-width="1.5"/>
  <text x="805" y="259" font-size="12" fill="#1b4f72" text-anchor="middle" font-weight="bold">WebClient</text>
  <text x="805" y="276" font-size="10" fill="#555555" text-anchor="middle">account B</text>

  <line x1="202" y1="115" x2="268" y2="155" stroke="#555555" stroke-width="2" marker-end="url(#nf_a)"/>
  <line x1="202" y1="235" x2="268" y2="200" stroke="#555555" stroke-width="2" marker-end="url(#nf_a)"/>
  <line x1="462" y1="175" x2="518" y2="175" stroke="#555555" stroke-width="2" marker-end="url(#nf_a)"/>
  <line x1="692" y1="160" x2="743" y2="90" stroke="#555555" stroke-width="2" marker-end="url(#nf_a)"/>
  <line x1="692" y1="175" x2="743" y2="175" stroke="#555555" stroke-width="2" marker-end="url(#nf_a)"/>
  <line x1="692" y1="190" x2="743" y2="260" stroke="#555555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#nf_a)"/>

  <text x="440" y="312" font-size="12" fill="#666666" text-anchor="middle">Global news goes to all accounts. Account news goes to one account only (dashed line: global news only).</text>
</svg>
