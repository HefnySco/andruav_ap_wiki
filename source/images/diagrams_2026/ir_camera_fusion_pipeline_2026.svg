<svg viewBox="0 0 1080 480" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="480" fill="#ffffff"/>

  <!-- Legend -->
  <rect x="20" y="16" width="18" height="18" fill="#e67e22"/>
  <text x="44" y="30" font-size="12" fill="#333333">DE-Module</text>
  <rect x="150" y="16" width="18" height="18" fill="#fff3cd" stroke="#e0b400" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="174" y="30" font-size="12" fill="#333333">Virtual Video Device</text>
  <rect x="330" y="16" width="18" height="18" fill="#eeeeee" stroke="#999999" stroke-width="1"/>
  <text x="354" y="30" font-size="12" fill="#333333">Hardware Input</text>

  <!-- Hardware inputs -->
  <rect x="20" y="150" width="150" height="60" rx="6" fill="#eeeeee" stroke="#999999" stroke-width="1.5"/>
  <text x="95" y="175" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">MI48 IR Sensor</text>
  <text x="95" y="193" font-size="11" fill="#666666" text-anchor="middle">(serial)</text>

  <rect x="20" y="260" width="150" height="60" rx="6" fill="#eeeeee" stroke="#999999" stroke-width="1.5"/>
  <text x="95" y="285" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">RGB Camera</text>
  <text x="95" y="303" font-size="11" fill="#666666" text-anchor="middle">(/dev/videoN)</text>

  <!-- de_ir_camera -->
  <rect x="230" y="195" width="170" height="90" rx="6" fill="#e67e22" stroke="#b35a00" stroke-width="1.5"/>
  <text x="315" y="230" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">de_ir_camera</text>
  <text x="315" y="248" font-size="11" fill="#ffffff" text-anchor="middle">fuse IR + RGB</text>
  <text x="315" y="263" font-size="11" fill="#ffffff" text-anchor="middle">detect hot/cold point</text>

  <line x1="170" y1="180" x2="230" y2="225" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="170" y1="290" x2="230" y2="255" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Virtual device band -->
  <rect x="440" y="140" width="600" height="200" fill="#fff3cd" stroke="#e0b400" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="740" y="160" font-size="13" fill="#8a6d00" text-anchor="middle" font-weight="bold">Virtual Video Drivers (v4l2loopback)</text>

  <rect x="460" y="205" width="130" height="60" rx="6" fill="#c0392b" stroke="#7b1c11" stroke-width="1.5"/>
  <text x="525" y="240" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">DE-THERMAL</text>

  <line x1="400" y1="240" x2="460" y2="235" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- de_tracker -->
  <rect x="620" y="330" width="150" height="60" rx="6" fill="#eeeeee" stroke="#999999" stroke-width="1.5"/>
  <text x="695" y="355" font-size="13" fill="#333333" text-anchor="middle" font-weight="bold">de_tracker</text>
  <text x="695" y="373" font-size="11" fill="#666666" text-anchor="middle">(track hot/cold point)</text>

  <line x1="590" y1="255" x2="695" y2="330" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="640" y="205" width="120" height="60" rx="6" fill="#27ae60" stroke="#186a3b" stroke-width="1.5"/>
  <text x="700" y="240" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">DE-TRK</text>

  <line x1="695" y1="330" x2="700" y2="265" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="840" y="205" width="150" height="60" rx="6" fill="#2980b9" stroke="#1b4f72" stroke-width="1.5"/>
  <text x="915" y="230" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="bold">de_ai / GCS</text>
  <text x="915" y="248" font-size="11" fill="#ffffff" text-anchor="middle">reads DE-TRK</text>

  <line x1="760" y1="235" x2="840" y2="235" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Sidecar message to comm bus -->
  <rect x="230" y="400" width="330" height="60" rx="6" fill="#f2f2f2" stroke="#999999" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="395" y="422" font-size="12" fill="#333333" text-anchor="middle" font-weight="bold">Comm Bus &#8594; GCS</text>
  <text x="395" y="440" font-size="11" fill="#666666" text-anchor="middle">TYPE_AndruavMessage_TrackingTargetLocation (1043)</text>
  <text x="395" y="454" font-size="10" fill="#888888" text-anchor="middle">reused for hot/cold thermal points, ~10Hz</text>

  <line x1="315" y1="285" x2="315" y2="400" stroke="#555555" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <text x="540" y="465" font-size="10" fill="#999999" text-anchor="middle">Source: IR/README.md, IR/drone_engage_IR_camera/README.md, de_databus/messages.hpp — 2026</text>
</svg>
