<svg viewBox="0 0 860 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="wc_a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="860" height="300" fill="#ffffff"/>
  <text x="430" y="28" font-size="17" fill="#333333" text-anchor="middle" font-weight="bold">WebClient Configuration — Two Files, One Result</text>

  <rect x="20" y="60" width="240" height="90" rx="10" fill="#7f8c8d" stroke="#566573" stroke-width="1.5"/>
  <text x="140" y="90" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">js_siteConfig.js</text>
  <text x="140" y="110" font-size="11" fill="#f2f3f4" text-anchor="middle">default values</text>
  <text x="140" y="128" font-size="11" fill="#f2f3f4" text-anchor="middle">built into the code</text>

  <rect x="20" y="180" width="240" height="90" rx="10" fill="#e67e22" stroke="#b35a00" stroke-width="1.5"/>
  <text x="140" y="210" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">public/config.json</text>
  <text x="140" y="230" font-size="11" fill="#ffffff" text-anchor="middle">your changes</text>
  <text x="140" y="248" font-size="11" fill="#ffffff" text-anchor="middle">no rebuild needed</text>

  <line x1="262" y1="105" x2="338" y2="150" stroke="#555555" stroke-width="2" marker-end="url(#wc_a)"/>
  <line x1="262" y1="225" x2="338" y2="180" stroke="#555555" stroke-width="2" marker-end="url(#wc_a)"/>
  <text x="300" y="245" font-size="11" fill="#b35a00" text-anchor="middle" font-weight="bold">wins</text>

  <rect x="340" y="110" width="200" height="110" rx="10" fill="#2980b9" stroke="#1b4f72" stroke-width="1.5"/>
  <text x="440" y="145" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">WebClient</text>
  <text x="440" y="166" font-size="11" fill="#eaf2f8" text-anchor="middle">server · map · features</text>
  <text x="440" y="184" font-size="11" fill="#eaf2f8" text-anchor="middle">header links · video servers</text>

  <line x1="542" y1="165" x2="618" y2="165" stroke="#555555" stroke-width="2" marker-end="url(#wc_a)"/>
  <text x="580" y="155" font-size="11" fill="#555555" text-anchor="middle">login</text>

  <rect x="620" y="110" width="220" height="110" rx="10" fill="#c0392b" stroke="#78281f" stroke-width="1.5"/>
  <text x="730" y="145" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Authenticator</text>
  <text x="730" y="166" font-size="11" fill="#fdedec" text-anchor="middle">CONST_PROD_MODE_IP</text>
  <text x="730" y="184" font-size="11" fill="#fdedec" text-anchor="middle">CONST_PROD_MODE_PORT (19408)</text>

  <text x="430" y="288" font-size="12" fill="#666666" text-anchor="middle">A value in config.json replaces the same value in js_siteConfig.js. Write only the values that you change.</text>
</svg>
