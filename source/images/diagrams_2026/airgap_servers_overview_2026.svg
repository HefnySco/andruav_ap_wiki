<svg viewBox="0 0 900 610" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="ag_ws" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2471a3"/>
    </marker>
    <marker id="ag_udp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d35400"/>
    </marker>
    <marker id="ag_s2s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7f8c8d"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="610" fill="#ffffff"/>
  <text x="450" y="28" font-size="17" fill="#333333" text-anchor="middle" font-weight="bold">Air-Gap Server — What Runs Inside the Raspberry Pi</text>

  <!-- Pi enclosure -->
  <rect x="250" y="60" width="630" height="460" rx="16" fill="#f8f9f9" stroke="#566573" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="565" y="82" font-size="13" fill="#566573" text-anchor="middle" font-weight="bold">Raspberry Pi  ·  airgap.local  ·  no internet needed</text>

  <!-- Clients -->
  <rect x="20" y="90" width="180" height="70" rx="10" fill="#2980b9" stroke="#1b4f72" stroke-width="1.5"/>
  <text x="110" y="120" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">WebClient</text>
  <text x="110" y="140" font-size="11" fill="#eaf2f8" text-anchor="middle">browser on a laptop</text>

  <rect x="20" y="230" width="180" height="70" rx="10" fill="#27ae60" stroke="#186a3b" stroke-width="1.5"/>
  <text x="110" y="258" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">Vehicle unit</text>
  <text x="110" y="278" font-size="11" fill="#eafaf1" text-anchor="middle">DroneEngage or Andruav</text>

  <rect x="20" y="410" width="180" height="70" rx="10" fill="#8e44ad" stroke="#5b2c6f" stroke-width="1.5"/>
  <text x="110" y="438" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">MAVLink GCS</text>
  <text x="110" y="458" font-size="11" fill="#f4ecf7" text-anchor="middle">QGroundControl, Mission Planner</text>

  <!-- Servers -->
  <rect x="290" y="100" width="240" height="90" rx="10" fill="#c0392b" stroke="#78281f" stroke-width="1.5"/>
  <text x="410" y="128" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">1 · Authenticator</text>
  <text x="410" y="148" font-size="11" fill="#fdedec" text-anchor="middle">andruavauth</text>
  <text x="410" y="170" font-size="11" fill="#ffffff" text-anchor="middle">API 19408 · Admin 8089 · S2S 19001</text>

  <rect x="290" y="250" width="240" height="90" rx="10" fill="#2471a3" stroke="#154360" stroke-width="1.5"/>
  <text x="410" y="278" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">2 · Communication Server</text>
  <text x="410" y="298" font-size="11" fill="#eaf2f8" text-anchor="middle">andruavmainserver</text>
  <text x="410" y="320" font-size="11" fill="#ffffff" text-anchor="middle">WSS 9966</text>

  <rect x="290" y="410" width="240" height="90" rx="10" fill="#d35400" stroke="#873600" stroke-width="1.5"/>
  <text x="410" y="438" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">4 · UDP Relay</text>
  <text x="410" y="458" font-size="11" fill="#fdebd0" text-anchor="middle">droneengage-udp-proxy</text>
  <text x="410" y="480" font-size="11" fill="#ffffff" text-anchor="middle">Control 9100 · UDP 40000–40999</text>

  <rect x="620" y="250" width="240" height="90" rx="10" fill="#16a085" stroke="#0e6655" stroke-width="1.5"/>
  <text x="740" y="278" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="bold">3 · Storage Server</text>
  <text x="740" y="298" font-size="11" fill="#e8f8f5" text-anchor="middle">de_storage_server · SQLite</text>
  <text x="740" y="320" font-size="11" fill="#ffffff" text-anchor="middle">S2S 9000 · Dashboard 9001</text>

  <rect x="620" y="100" width="240" height="90" rx="10" fill="#ffffff" stroke="#2980b9" stroke-width="1.5"/>
  <text x="740" y="128" font-size="14" fill="#1b4f72" text-anchor="middle" font-weight="bold">WebClient web site</text>
  <text x="740" y="150" font-size="11" fill="#333333" text-anchor="middle">HTTPS 8001</text>
  <text x="740" y="170" font-size="11" fill="#333333" text-anchor="middle">offline maps 88 · wiki 8080</text>

  <rect x="620" y="410" width="240" height="90" rx="10" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.5"/>
  <text x="740" y="438" font-size="14" fill="#333333" text-anchor="middle" font-weight="bold">Network helpers</text>
  <text x="740" y="460" font-size="11" fill="#333333" text-anchor="middle">dnsmasq: DNS and DHCP</text>
  <text x="740" y="480" font-size="11" fill="#333333" text-anchor="middle">coturn 3478: video relay</text>

  <!-- Client → web site (open the page) -->
  <path d="M110,90 V48 H740 V100" fill="none" stroke="#2471a3" stroke-width="2" marker-end="url(#ag_ws)"/>
  <text x="430" y="44" font-size="11" fill="#2471a3" text-anchor="middle">open the page</text>

  <!-- Login arrows -->
  <line x1="200" y1="115" x2="288" y2="130" stroke="#2471a3" stroke-width="2" marker-end="url(#ag_ws)"/>
  <text x="240" y="112" font-size="11" fill="#2471a3" text-anchor="middle" font-weight="bold">A login</text>
  <line x1="200" y1="243" x2="288" y2="175" stroke="#2471a3" stroke-width="2" marker-end="url(#ag_ws)"/>
  <text x="228" y="200" font-size="11" fill="#2471a3" text-anchor="middle" font-weight="bold">A login</text>

  <!-- WSS arrows -->
  <line x1="200" y1="148" x2="288" y2="268" stroke="#2471a3" stroke-width="2" marker-end="url(#ag_ws)"/>
  <line x1="200" y1="270" x2="288" y2="290" stroke="#2471a3" stroke-width="2" marker-end="url(#ag_ws)"/>
  <text x="252" y="300" font-size="11" fill="#2471a3" text-anchor="middle" font-weight="bold">B WSS</text>

  <!-- UDP arrows -->
  <line x1="200" y1="290" x2="288" y2="428" stroke="#d35400" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#ag_udp)" marker-end="url(#ag_udp)"/>
  <line x1="200" y1="455" x2="288" y2="455" stroke="#d35400" stroke-width="2" stroke-dasharray="6 4" marker-start="url(#ag_udp)" marker-end="url(#ag_udp)"/>
  <text x="225" y="395" font-size="11" fill="#d35400" text-anchor="middle" font-weight="bold">C MAVLink</text>

  <!-- S2S arrows inside the Pi -->
  <line x1="410" y1="248" x2="410" y2="192" stroke="#7f8c8d" stroke-width="2" marker-end="url(#ag_s2s)"/>
  <text x="418" y="224" font-size="11" fill="#566573">S2S</text>
  <line x1="532" y1="295" x2="618" y2="295" stroke="#7f8c8d" stroke-width="2" marker-end="url(#ag_s2s)"/>
  <text x="575" y="288" font-size="11" fill="#566573" text-anchor="middle">S2S</text>
  <line x1="410" y1="342" x2="410" y2="408" stroke="#7f8c8d" stroke-width="2" marker-end="url(#ag_s2s)"/>
  <text x="418" y="380" font-size="11" fill="#566573">S2S</text>

  <!-- Legend -->
  <line x1="40" y1="560" x2="80" y2="560" stroke="#2471a3" stroke-width="2"/>
  <text x="88" y="564" font-size="12" fill="#333333">secure WebSocket (WSS) or HTTPS</text>
  <line x1="320" y1="560" x2="360" y2="560" stroke="#d35400" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="368" y="564" font-size="12" fill="#333333">MAVLink over UDP</text>
  <line x1="540" y1="560" x2="580" y2="560" stroke="#7f8c8d" stroke-width="2"/>
  <text x="588" y="564" font-size="12" fill="#333333">server to server (S2S), inside the Pi</text>
  <text x="450" y="594" font-size="12" fill="#666666" text-anchor="middle">A: log in to the Authenticator  ·  B: connect to the Communication Server  ·  C: optional MAVLink link</text>
</svg>
